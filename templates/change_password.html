<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - TeenBuzz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="{{ url_for('home') }}">TeenBuzz</a>
            </div>
            <div class="nav-menu">
                <a href="{{ url_for('home') }}" class="nav-link">Home</a>
                <a href="{{ url_for('categories') }}" class="nav-link">Categories</a>
                <a href="{{ url_for('search_articles') }}" class="nav-link">Search</a>
                {% if is_authenticated %}
                    <a href="{{ url_for('user_profile') }}" class="nav-link">Profile</a>
                    <a href="{{ url_for('logout') }}" class="nav-link">Logout</a>
                {% else %}
                    <a href="{{ url_for('login') }}" class="nav-link">Login</a>
                    <a href="{{ url_for('register') }}" class="nav-link">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-header">
                        <h1>Change Password</h1>
                        <p>Update your account password</p>
                    </div>

                    <!-- Flash Messages -->
                    <div id="flash-messages"></div>

                    <form method="POST" class="auth-form">
                        <div class="form-group">
                            <label for="old_password">Current Password</label>
                            <input type="password" id="old_password" name="old_password" required>
                        </div>

                        <div class="form-group">
                            <label for="new_password">New Password</label>
                            <input type="password" id="new_password" name="new_password" required>
                            <small class="form-help">
                                Password must be at least 8 characters with uppercase, lowercase, number, and special character.
                            </small>
                        </div>

                        <div class="form-group">
                            <label for="confirm_password">Confirm New Password</label>
                            <input type="password" id="confirm_password" name="confirm_password" required>
                        </div>

                        <button type="submit" class="btn btn-primary">Change Password</button>
                    </form>

                    <div class="auth-footer">
                        <a href="{{ url_for('user_profile') }}" class="auth-link">← Back to Profile</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/flash-messages.js') }}"></script>
</body>
</html>
